<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Lab Representation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Choose a Room</h2>
        <ul>
            {% for room in rooms %}
                <li><a href="{{ url_for('room', current_room=room.room_number) }}">Room {{ room.room_number }}{% if room.eam_room %} (EAM){% endif %}</a></li>
            {% endfor %}
            <li><a href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Choose a Room</h1>
        <ul>
            <li><a href="{{ url_for('room', current_room='1') }}">Room 1</a></li>
            <li><a href="{{ url_for('room', current_room='2') }}">Room 2</a></li>
            <!-- Add more rooms as needed -->
        </ul>
    </div>

    <!-- Popup Messages -->
    <div class="flash-popup">
        <div class="flash-popup-content">
            <p class="flash-message"></p>
            <button class="close-btn">&times;</button>
        </div>
    </div>

    <script type="text/javascript">
        function showPopup(message, type) {
            const popup = document.querySelector('.flash-popup');
            const popupContent = document.querySelector('.flash-popup-content');
            const messageElement = document.querySelector('.flash-message');
            const closeButton = document.querySelector('.close-btn');

            popup.style.display = 'flex'; // Show the popup overlay
            popupContent.classList.add(type); // Add the type (success, warning, danger) class
            messageElement.textContent = message; // Set the message text

            // Optional: Hide the popup when clicking the close button
            closeButton.onclick = function() {
                popup.style.display = 'none';
            };
        }

        window.onload = function() {
            const flashMessages = {{ get_flashed_messages(with_categories=true) | tojson }};
            console.log(flashMessages);
            if (flashMessages.length > 0) {
                const message = flashMessages[0][1]; // Get the message text
                const type = flashMessages[0][0]; // Get the category (success, warning, danger)
                showPopup(message, type); // Display the popup
            }
        };
    </script>
</body>
</html>
